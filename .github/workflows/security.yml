# Reusable security workflow: SAST (Semgrep), SCA (OSV-Scanner) and secret
# scanning (Gitleaks), followed by one gate job that decides pass or fail.
#
# Call it from another repository with:
#
#   jobs:
#     security:
#       uses: KhalidSharafEl-Din/ci-security-pipeline/.github/workflows/security.yml@<commit-sha>
#       permissions:
#         contents: read
#         security-events: write
#         actions: read
#
# See README.md for inputs, the gate rules and how to suppress a finding.

name: security

on:
  workflow_call:
    inputs:
      severity-threshold:
        description: Lowest severity that fails the gate, "high" or "critical". Secrets always fail it.
        type: string
        default: high
      semgrep-config:
        description: Space-separated Semgrep configs (registry rulesets, URLs or paths in your repo).
        type: string
        default: p/default
      semgrep-extra-rules-repo:
        description: Optional "owner/repo" holding extra Semgrep rules, for example a team rule pack.
        type: string
        default: ""
      semgrep-extra-rules-ref:
        description: Commit SHA (recommended) or tag of the extra rules repo. Required when the repo is set.
        type: string
        default: ""
      semgrep-extra-rules-path:
        description: Path to the rules inside the extra rules repo.
        type: string
        default: .
      sca-paths:
        description: Space-separated paths that OSV-Scanner searches recursively for lockfiles.
        type: string
        default: .
      upload-sarif:
        description: Upload full-scan results to GitHub code scanning. Set to false on private repos without GitHub Code Security.
        type: boolean
        default: true
      name:
        description: Suffix for artifact names and code scanning categories. Set it when you call the workflow more than once in a run.
        type: string
        default: ""
    outputs:
      blocking-findings:
        description: Number of findings that failed the gate.
        value: ${{ jobs.gate.outputs.blocking }}

permissions: {}

env:
  # Tool versions live here so one change updates every job. Bump them with
  # scripts/update-tool-pins.sh, which also refreshes the checksums and digest.
  SEMGREP_IMAGE: semgrep/semgrep:1.184.0@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed
  OSV_SCANNER_VERSION: 2.7.0
  OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # check out the code
      security-events: write # upload SARIF to code scanning
      actions: read # code scanning reads the run metadata on private repos
    outputs:
      blocking: ${{ steps.result.outputs.blocking }}
      total: ${{ steps.result.outputs.total }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out extra rules
        if: inputs.semgrep-extra-rules-repo != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.semgrep-extra-rules-repo }}
          ref: ${{ inputs.semgrep-extra-rules-ref }}
          path: .semgrep-extra-rules
          persist-credentials: false

      - name: Work out scan scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          THRESHOLD: ${{ inputs.severity-threshold }}
          EXTRA_REPO: ${{ inputs.semgrep-extra-rules-repo }}
          EXTRA_REF: ${{ inputs.semgrep-extra-rules-ref }}
        run: |
          set -euo pipefail
          case "$THRESHOLD" in
            high) echo "min-rank=3" >> "$GITHUB_OUTPUT" ;;
            critical) echo "min-rank=4" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::severity-threshold must be high or critical, got '$THRESHOLD'"; exit 1 ;;
          esac
          if [ -n "$EXTRA_REPO" ] && [ -z "$EXTRA_REF" ]; then
            echo "::error::semgrep-extra-rules-ref is required when semgrep-extra-rules-repo is set"; exit 1
          fi
          if [ -n "$EXTRA_REF" ] && ! [[ "$EXTRA_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::semgrep-extra-rules-ref is not a full commit SHA. Pin it to a SHA so the rules cannot change under you."
          fi
          # On pull requests the checkout is the merge commit, so its first
          # parent is the target branch. Findings already there are not new.
          # In a merge queue the event names the base commit of the group.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "mode=diff" >> "$GITHUB_OUTPUT"
            echo "baseline=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            echo "mode=diff" >> "$GITHUB_OUTPUT"
            echo "baseline=$MERGE_GROUP_BASE" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Semgrep
        id: scan
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          BASELINE: ${{ steps.scope.outputs.baseline }}
          SEMGREP_CONFIG: ${{ inputs.semgrep-config }}
          EXTRA_REPO: ${{ inputs.semgrep-extra-rules-repo }}
          EXTRA_PATH: ${{ inputs.semgrep-extra-rules-path }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/semgrep"
          mkdir -p "$out"
          args=(scan --metrics=off --disable-version-check
                --exclude=.semgrep-extra-rules
                --sarif-output=/out/semgrep.sarif --json-output=/out/semgrep.json)
          read -r -a configs <<< "$SEMGREP_CONFIG"
          for c in "${configs[@]}"; do args+=(--config "$c"); done
          if [ -n "$EXTRA_REPO" ]; then args+=(--config ".semgrep-extra-rules/$EXTRA_PATH"); fi
          if [ "$MODE" = "diff" ]; then args+=(--baseline-commit "$BASELINE"); fi
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" -v "$out:/out" -w /src \
            --entrypoint sh "$SEMGREP_IMAGE" \
            -c 'git config --global --add safe.directory /src && exec semgrep "$@"' semgrep "${args[@]}"

      - name: Check suppressions have a reason
        id: suppressions
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          BASELINE: ${{ steps.scope.outputs.baseline }}
        run: |
          set -euo pipefail
          # Semgrep treats any word that starts with "nosem" after a space as a
          # suppression marker, in any case, in comments or not. Each one must
          # name the rule and give a reason, like this:
          #   // nosemgrep: rule-id -- why this is safe
          # The third branch matches a marker at the start of a line, after the
          # "file:line:" prefix. The bracket stops this check matching itself.
          marker='(^|[[:space:]]|^[^:]*:[0-9]+:)nose[m]'
          valid='nosem([g]rep)?[:=] *[A-Za-z0-9_.-]+( *, *[A-Za-z0-9_.-]+)* +-- +[^ ]'
          if [ "$MODE" = "diff" ]; then
            # Pull requests only answer for the lines they add.
            lines=$(git diff -U0 --no-color "$BASELINE" HEAD -- . ':!*.md' | awk '
              /^diff --git / { header = 1; next }
              header && /^\+\+\+ / { file = substr($0, 7); header = 0; next }
              /^@@ / { split($3, range, ","); line = substr(range[1], 2) + 0; next }
              !header && /^\+/ { print file ":" line ":" substr($0, 2); line++ }')
          else
            lines=$(git grep -niE "$marker" -- ':!*.md' || true)
          fi
          bad=$(printf '%s\n' "$lines" | grep -iE "$marker" | grep -viE "$valid" || true)
          count=0
          if [ -n "$bad" ]; then
            count=$(printf '%s\n' "$bad" | wc -l)
            while IFS=: read -r file line _; do
              echo "::error file=$file,line=$line::nosemgrep needs a rule ID and a reason: 'nosemgrep: rule-id -- reason'"
            done <<< "$bad"
          fi
          echo "violations=$count" >> "$GITHUB_OUTPUT"

      - name: Evaluate findings
        id: result
        env:
          MIN_RANK: ${{ steps.scope.outputs.min-rank }}
          MODE: ${{ steps.scope.outputs.mode }}
          VIOLATIONS: ${{ steps.suppressions.outputs.violations }}
        run: |
          set -euo pipefail
          json="$RUNNER_TEMP/semgrep/semgrep.json"
          rank='def rank: {"CRITICAL":4,"HIGH":3,"ERROR":3,"MEDIUM":2,"WARNING":2,"LOW":1,"INFO":1}[.] // 0;'
          total=$(jq '.results | length' "$json")
          high=$(jq --argjson min "$MIN_RANK" "$rank"' [.results[] | select(.extra.severity | rank >= $min)] | length' "$json")
          # A timeout or crash means part of the code was never analysed, so a
          # clean result can't be trusted. Parse errors in single files are
          # reported but don't block, because Semgrep still scans the rest.
          incomplete_filter='[.errors[]? | select(.level == "error" or ((.type | if type == "array" then .[0] else . end | tostring) | test("Timeout|OutOfMemory|StackOverflow|Fatal")))]'
          incomplete=$(jq "$incomplete_filter | length" "$json")
          errors=$(jq '[.errors[]?] | length' "$json")
          jq -r "$incomplete_filter"' | .[] | "::error title=Semgrep incomplete analysis::\(.type | tostring) \(.path // "" ) \(.message // "" | gsub("%"; "%25") | gsub("[\r\n]+"; " ") | .[0:200])"' "$json"
          blocking=$((high + VIOLATIONS + incomplete))
          {
            echo "### SAST (Semgrep)"
            echo
            if [ "$MODE" = "diff" ]; then echo "Scope: findings new in this pull request."; else echo "Scope: full scan."; fi
            echo
            echo "Findings: $total. Blocking: $blocking (suppressions without a reason: $VIOLATIONS, incomplete analysis: $incomplete)."
            echo
            echo "Scanner errors: $errors. Timeouts and crashes block the gate. Parse errors in single files are reported only, and are listed in the semgrep-report artifact."
            if [ "$total" -gt 0 ]; then
              echo
              echo "| Severity | Rule | Location | Gate |"
              echo "| --- | --- | --- | --- |"
              jq -r --argjson min "$MIN_RANK" "$rank"' .results[] |
                "| \(.extra.severity) | `\(.check_id)` | `\(.path):\(.start.line)` | \(if (.extra.severity | rank) >= $min then "blocks" else "reported" end) |"' "$json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" = "diff" ]; then
            jq -r --argjson min "$MIN_RANK" "$rank"' .results[] |
              "::\(if (.extra.severity | rank) >= $min then "error" else "warning" end) file=\(.path),line=\(.start.line),title=Semgrep \(.check_id)::\(.extra.message | gsub("%"; "%25") | gsub("[\r\n]+"; " ") | .[0:300])"' "$json"
          fi
          {
            echo "total=$total"
            echo "blocking=$blocking"
            echo "incomplete=$incomplete"
          } >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to code scanning
        # Only full scans upload. A pull request scan holds only new findings,
        # so code scanning would mark every existing alert as fixed. Pull
        # requests get annotations on the diff instead, and fork pull requests
        # (read-only token) never reach this step. An incomplete scan doesn't
        # upload either, for the same reason. Its report stays in the artifact.
        if: >-
          always() && steps.scan.outcome == 'success' && inputs.upload-sarif && steps.scope.outputs.mode == 'full' &&
          steps.result.outcome == 'success' && steps.result.outputs.incomplete == '0'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/semgrep/semgrep.sarif
          category: semgrep${{ inputs.name != '' && format('-{0}', inputs.name) || '' }}

      - name: Keep the reports
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-report${{ inputs.name != '' && format('-{0}', inputs.name) || '' }}
          path: ${{ runner.temp }}/semgrep/
          retention-days: 14

  sca:
    name: SCA (OSV-Scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # check out the code
      security-events: write # upload SARIF to code scanning
      actions: read # code scanning reads the run metadata on private repos
    outputs:
      blocking: ${{ steps.result.outputs.blocking }}
      total: ${{ steps.result.outputs.total }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install OSV-Scanner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner

      - name: Work out scan scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          THRESHOLD: ${{ inputs.severity-threshold }}
        run: |
          set -euo pipefail
          case "$THRESHOLD" in
            high) echo "min-score=7.0" >> "$GITHUB_OUTPUT" ;;
            critical) echo "min-score=9.0" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::severity-threshold must be high or critical, got '$THRESHOLD'"; exit 1 ;;
          esac
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "mode=diff" >> "$GITHUB_OUTPUT"
            echo "baseline=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            echo "mode=diff" >> "$GITHUB_OUTPUT"
            echo "baseline=$MERGE_GROUP_BASE" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Run OSV-Scanner
        id: scan
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          BASELINE: ${{ steps.scope.outputs.baseline }}
          SCA_PATHS: ${{ inputs.sca-paths }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/osv"
          mkdir -p "$out"
          read -r -a paths <<< "$SCA_PATHS"
          # Exit codes: 0 no vulnerabilities, 1 vulnerabilities found,
          # 128 no lockfiles found. Anything else is a real error.
          osv() {
            local format=$1 file=$2 rc=0
            "$RUNNER_TEMP/bin/osv-scanner" scan source -r --format "$format" --output-file "$file" "${paths[@]}" || rc=$?
            case "$rc" in
              0|1) echo found > "$file.status" ;;
              128) echo '{"results":[]}' > "$file"; echo none > "$file.status" ;;
              *) echo "::error::osv-scanner exited with $rc"; return "$rc" ;;
            esac
          }
          osv json "$out/head.json"
          osv sarif "$out/osv.sarif"
          if [ ! -s "$out/osv.sarif" ] || ! jq -e .runs "$out/osv.sarif" > /dev/null 2>&1; then
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"osv-scanner","rules":[]}},"results":[]}]}' > "$out/osv.sarif"
          fi
          if [ "$MODE" = "diff" ]; then
            git worktree add --detach "$RUNNER_TEMP/baseline" "$BASELINE" > /dev/null
            (cd "$RUNNER_TEMP/baseline" && osv json "$out/base.json")
          else
            echo '{"results":[]}' > "$out/base.json"
            echo none > "$out/base.json.status"
          fi

      - name: Check suppressions have a reason
        id: suppressions
        shell: python
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          BASELINE: ${{ steps.scope.outputs.baseline }}
        run: |
          import os, subprocess, tomllib
          # Pull requests only answer for the ignore files they change.
          if os.environ["MODE"] == "diff":
              cmd = ["git", "diff", "--name-only", "--diff-filter=d", os.environ["BASELINE"], "HEAD", "--", "*osv-scanner.toml"]
          else:
              cmd = ["git", "ls-files", "*osv-scanner.toml"]
          files = subprocess.run(cmd, capture_output=True, text=True, check=True).stdout.split()
          violations = 0
          for path in files:
              with open(path, "rb") as fh:
                  config = tomllib.load(fh)
              for entry in config.get("IgnoredVulns", []):
                  problems = []
                  if not str(entry.get("reason", "")).strip():
                      problems.append("a reason")
                  if "ignoreUntil" not in entry:
                      problems.append("an ignoreUntil date")
                  if problems:
                      violations += 1
                      print(f"::error file={path}::Ignored vulnerability {entry.get('id', '?')} needs {' and '.join(problems)}")
              # Package overrides can hide every advisory for a package, so they
              # need the same reason and expiry as single ignores.
              for entry in config.get("PackageOverrides", []):
                  problems = []
                  if not str(entry.get("reason", "")).strip():
                      problems.append("a reason")
                  if "effectiveUntil" not in entry:
                      problems.append("an effectiveUntil date")
                  if problems:
                      violations += 1
                      print(f"::error file={path}::Package override for {entry.get('name', 'all packages')} needs {' and '.join(problems)}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"violations={violations}\n")

      - name: Evaluate findings
        id: result
        env:
          MIN_SCORE: ${{ steps.scope.outputs.min-score }}
          MODE: ${{ steps.scope.outputs.mode }}
          VIOLATIONS: ${{ steps.suppressions.outputs.violations }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/osv"
          # Flatten to one row per (lockfile, package, advisory). Paths are made
          # relative so the head and baseline scans can be compared.
          # shellcheck disable=SC2016 # $src and friends are jq variables
          flatten='[.results[]? | .source.path as $src | .packages[]? | .package as $p | .groups[]? |
            ($src | ltrimstr($root) | ltrimstr("/")) as $file |
            {key: ($file + " " + $p.ecosystem + "/" + $p.name + " " + .ids[0]),
             file: $file, pkg: "\($p.name)@\($p.version)", id: .ids[0],
             cve: ([.aliases[]? | select(startswith("CVE-"))] | first // ""), score: (.max_severity // "")}]'
          jq --arg root "$GITHUB_WORKSPACE" "$flatten" "$out/head.json" > "$out/head-rows.json"
          jq --arg root "$RUNNER_TEMP/baseline" "$flatten" "$out/base.json" > "$out/base-rows.json"
          # A row blocks when it is new, and its CVSS score meets the threshold
          # or it is a known malicious package (MAL- advisories carry no score).
          jq --slurpfile base "$out/base-rows.json" --argjson min "$MIN_SCORE" '
            ($base[0] | map(.key)) as $old |
            map(. + {new: ((.key | IN($old[])) | not)}) |
            map(. + {blocks: (.new and ((.id | startswith("MAL-")) or ((.score | tonumber? // 0) >= $min)))})
          ' "$out/head-rows.json" > "$out/rows.json"
          total=$(jq 'length' "$out/rows.json")
          vulns=$(jq '[.[] | select(.blocks)] | length' "$out/rows.json")
          # Losing every lockfile is not the same as having no vulnerabilities.
          # If the baseline had lockfiles and this change has none, block.
          lost=0
          if [ "$(cat "$out/base.json.status")" = found ] && [ "$(cat "$out/head.json.status")" = none ]; then
            lost=1
            echo "::error title=OSV-Scanner coverage lost::The target branch has lockfiles under sca-paths, but this change has none. Restore the lockfile or change sca-paths."
          fi
          coverage="lockfiles found"
          if [ "$(cat "$out/head.json.status")" = none ]; then coverage="no lockfiles found under sca-paths"; fi
          blocking=$((vulns + VIOLATIONS + lost))
          {
            echo "### SCA (OSV-Scanner)"
            echo
            if [ "$MODE" = "diff" ]; then echo "Scope: advisories new in this pull request."; else echo "Scope: full scan."; fi
            echo
            echo "Coverage: $coverage."
            echo
            echo "Advisories: $total. Blocking: $blocking (ignore entries without a reason or expiry: $VIOLATIONS, lockfiles lost: $lost)."
            if [ "$total" -gt 0 ]; then
              echo
              echo "| Advisory | CVE | Package | CVSS | Lockfile | New | Gate |"
              echo "| --- | --- | --- | --- | --- | --- | --- |"
              jq -r '.[] | "| \(.id) | \(.cve) | `\(.pkg)` | \(if .score == "" then "unknown" else .score end) | `\(.file)` | \(if .new then "yes" else "no" end) | \(if .blocks then "blocks" else "reported" end) |"' "$out/rows.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MODE" = "diff" ]; then
            jq -r '.[] | select(.new) | "::\(if .blocks then "error" else "warning" end) file=\(.file),title=OSV \(.id)::\(.pkg) \(.cve) CVSS \(if .score == "" then "unknown" else .score end)"' "$out/rows.json"
          fi
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "blocking=$blocking" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to code scanning
        # Only full scans upload. A pull request scan holds only new findings,
        # so code scanning would mark every existing alert as fixed. Pull
        # requests get annotations on the diff instead, and fork pull requests
        # (read-only token) never reach this step.
        if: always() && steps.scan.outcome == 'success' && inputs.upload-sarif && steps.scope.outputs.mode == 'full'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/osv/osv.sarif
          category: osv-scanner${{ inputs.name != '' && format('-{0}', inputs.name) || '' }}

      - name: Keep the reports
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-scanner-report${{ inputs.name != '' && format('-{0}', inputs.name) || '' }}
          path: ${{ runner.temp }}/osv/
          retention-days: 14

  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # check out the code
      security-events: write # upload SARIF to code scanning
      actions: read # code scanning reads the run metadata on private repos
    outputs:
      blocking: ${{ steps.result.outputs.blocking }}
      total: ${{ steps.result.outputs.total }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks

      - name: Work out scan scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "mode=diff" >> "$GITHUB_OUTPUT"
            echo "baseline=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            echo "mode=diff" >> "$GITHUB_OUTPUT"
            echo "baseline=$MERGE_GROUP_BASE" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Gitleaks
        id: scan
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          BASELINE: ${{ steps.scope.outputs.baseline }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gitleaks"
          mkdir -p "$out"
          # --redact keeps secret values out of the log and the SARIF file.
          # --ignore-gitleaks-allow turns off inline allow comments, so every
          # exception goes through .gitleaksignore, where it needs a reason.
          args=(git --redact --no-banner --exit-code 0 --ignore-gitleaks-allow
                --report-format sarif --report-path "$out/gitleaks.sarif")
          # On pull requests, scan every commit the PR adds, not only the
          # final tree, because a secret committed and then deleted still leaked.
          # Full scans cover the history of the checked-out commit, not every
          # fetched branch. --remerge-diff adds what a merge commit changed
          # while resolving conflicts, which plain "git log -p" leaves out.
          if [ "$MODE" = "diff" ]; then range="${BASELINE}..HEAD"; else range="HEAD"; fi
          args+=("--log-opts=--remerge-diff ${range}")
          "$RUNNER_TEMP/bin/gitleaks" "${args[@]}" .
          # --remerge-diff can't show what an octopus merge (three or more
          # parents) added, so a secret could hide there. A pull request that
          # adds one is blocked. Full scans only warn, because an old octopus
          # merge in history can't be undone.
          octopus=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            if [ "$MODE" = "diff" ]; then
              octopus=$((octopus + 1))
              echo "::error title=Gitleaks can't scan this merge::Commit $sha merges three or more parents. Gitleaks can't see what it added, so the gate blocks it. Merge one branch at a time."
            else
              echo "::warning title=Gitleaks can't scan this merge::Commit $sha merges three or more parents. Gitleaks couldn't check what it added. Review it by hand once."
            fi
          done <<< "$(git rev-list --min-parents=3 "$range")"
          echo "octopus=$octopus" >> "$GITHUB_OUTPUT"
          # Code scanning needs paths that exist. Findings from a merge
          # resolution carry a "b/" prefix from the remerge diff, so the upload
          # copy strips it. The report keeps it, because the fingerprint uses it.
          jq '(.runs[].results[]?.locations[]?.physicalLocation.artifactLocation.uri) |= sub("^b/"; "")' \
            "$out/gitleaks.sarif" > "$RUNNER_TEMP/gitleaks-upload.sarif"

      - name: Check suppressions have a reason
        id: suppressions
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          BASELINE: ${{ steps.scope.outputs.baseline }}
        run: |
          set -euo pipefail
          # Each block of fingerprints in .gitleaksignore needs a "# reason"
          # comment right above it. A blank line ends the block. Pull requests
          # only answer for the file when they change it.
          count=0
          check=true
          if [ "$MODE" = "diff" ] && git diff --quiet "$BASELINE" HEAD -- .gitleaksignore; then check=false; fi
          if [ -f .gitleaksignore ] && [ "$check" = true ]; then
            count=$(awk '
              /^[[:space:]]*$/ { covered = 0; next }
              /^[[:space:]]*#[[:space:]]*[^[:space:]]/ { covered = 1; next }
              /^[[:space:]]*#/ { covered = 0; next }
              !covered { bad++; printf "::error file=.gitleaksignore,line=%d::Fingerprint without a reason comment above it\n", NR > "/dev/stderr" }
              END { print bad + 0 }' .gitleaksignore)
          fi
          # Scanner configuration can switch rules off, so flag every change to
          # it for a security reviewer. This doesn't block.
          if [ "$MODE" = "diff" ]; then
            changed=$(git diff --name-only "$BASELINE" HEAD -- .gitleaks.toml .gitleaksignore .semgrepignore '*osv-scanner.toml' || true)
            if [ -n "$changed" ]; then
              while IFS= read -r file; do
                echo "::warning file=$file::This pull request changes scanner configuration. Ask a security reviewer to approve it."
              done <<< "$changed"
            fi
          fi
          echo "violations=$count" >> "$GITHUB_OUTPUT"

      - name: Evaluate findings
        id: result
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          VIOLATIONS: ${{ steps.suppressions.outputs.violations }}
          OCTOPUS: ${{ steps.scan.outputs.octopus }}
        run: |
          set -euo pipefail
          sarif="$RUNNER_TEMP/gitleaks/gitleaks.sarif"
          total=$(jq '[.runs[].results[]?] | length' "$sarif")
          # Any secret blocks, whatever the severity threshold.
          blocking=$((total + VIOLATIONS + OCTOPUS))
          {
            echo "### Secrets (Gitleaks)"
            echo
            if [ "$MODE" = "diff" ]; then echo "Scope: commits added by this pull request."; else echo "Scope: full git history."; fi
            echo
            echo "Secrets: $total. Blocking: $blocking (ignore entries without a reason: $VIOLATIONS, merges Gitleaks can't scan: $OCTOPUS)."
            if [ "$total" -gt 0 ]; then
              echo
              echo "Rotate each secret, then add its fingerprint to \`.gitleaksignore\` under a reason comment."
              echo
              echo "| Rule | Location | Fingerprint (rotated secret) | Fingerprint (false positive) |"
              echo "| --- | --- | --- | --- |"
              jq -r '.runs[].results[] | .locations[0].physicalLocation as $loc |
                "| `\(.ruleId)` | `\($loc.artifactLocation.uri):\($loc.region.startLine)` | `\(.partialFingerprints.commitSha):\($loc.artifactLocation.uri):\(.ruleId):\($loc.region.startLine)` | `\($loc.artifactLocation.uri):\(.ruleId):\($loc.region.startLine)` |"' "$sarif"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Findings from a merge resolution carry a "b/" path prefix from the
          # remerge diff. The annotation strips it. The fingerprint keeps it,
          # because that's the string Gitleaks matches against .gitleaksignore.
          if [ "$MODE" = "diff" ]; then
            jq -r '.runs[].results[] | .locations[0].physicalLocation as $loc |
              "::error file=\($loc.artifactLocation.uri | sub("^b/"; "")),line=\($loc.region.startLine),title=Gitleaks \(.ruleId)::Possible secret. Rotate it, then add the fingerprint from the job summary to .gitleaksignore."' "$sarif"
          fi
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "blocking=$blocking" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to code scanning
        # Only full scans upload. A pull request scan holds only new findings,
        # so code scanning would mark every existing alert as fixed. Pull
        # requests get annotations on the diff instead, and fork pull requests
        # (read-only token) never reach this step.
        if: always() && steps.scan.outcome == 'success' && inputs.upload-sarif && steps.scope.outputs.mode == 'full'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/gitleaks-upload.sarif
          category: gitleaks${{ inputs.name != '' && format('-{0}', inputs.name) || '' }}

      - name: Keep the reports
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report${{ inputs.name != '' && format('-{0}', inputs.name) || '' }}
          path: ${{ runner.temp }}/gitleaks/
          retention-days: 14

  gate:
    name: gate
    needs: [sast, sca, secrets]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      blocking: ${{ steps.decide.outputs.blocking }}
    steps:
      - name: Decide
        id: decide
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # A scanner that crashed or was cancelled fails the gate. Silence
          # from a broken scanner must never read as "no findings".
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key) (\(.value.result))"' <<< "$NEEDS")
          blocking=$(jq '[.[] | .outputs.blocking // "0" | tonumber] | add' <<< "$NEEDS")
          echo "blocking=$blocking" >> "$GITHUB_OUTPUT"
          {
            echo "### Security gate"
            echo
            echo "| Check | Job result | Findings | Blocking |"
            echo "| --- | --- | --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) | \(.value.outputs.total // "-") | \(.value.outputs.blocking // "-") |"' <<< "$NEEDS"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$failed" ]; then
            echo "Result: FAIL. A scanner did not finish: $failed." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Gate failed because a scanner did not finish: $failed"
            exit 1
          fi
          if [ "$blocking" -gt 0 ]; then
            echo "Result: FAIL. $blocking blocking finding(s). See the scanner sections above." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Gate failed with $blocking blocking finding(s)"
            exit 1
          fi
          echo "Result: PASS." >> "$GITHUB_STEP_SUMMARY"
